name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 签名由 Gradle 侧从 KEYSTORE_BASE64 解出临时 jks（见 app/build.gradle.kts），
      # 这里只需把 secrets 透出成环境变量给 Gradle 用。
      - name: Build (signed release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify release signature
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for APK in $(find app/build/outputs/apk -name '*.apk' | sort); do
            echo "checking $APK"
            "$BT/apksigner" verify --print-certs "$APK" | head -6
          done

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -la out

      # 打包自检：两种 flavor 的入口元数据与实际入口类是否都进了 APK。
      # 缺任何一个都会表现为「模块在微信里完全不加载、任何入口都没有」，人工很难发现。
      - name: Inspect APK entries
        run: |
          set -e
          python3 - <<'PY'
          import glob, zipfile
          for apk in sorted(glob.glob("out/*.apk")):
              z = zipfile.ZipFile(apk)
              names = set(z.namelist())
              flavor = "standard" if "standard" in apk else ("legacy" if "legacy" in apk else "?")
              print("==", apk, "flavor=", flavor)
              dex = b"".join(z.read(n) for n in names if n.startswith("classes") and n.endswith(".dex"))
              if flavor == "legacy":
                  entry = z.read("assets/xposed_init").decode().strip() if "assets/xposed_init" in names else ""
                  print("  assets/xposed_init:", entry or "MISSING")
                  needle = entry.splitlines()[0].replace(".", "/").encode() if entry else b""
                  print("  legacy entry class in dex:", bool(needle) and needle in dex)
                  print("  META-INF/xposed present:", any(n.startswith("META-INF/xposed") for n in names), "(应为 False)")
              else:
                  for n in ("META-INF/xposed/java_init.list", "META-INF/xposed/module.prop", "META-INF/xposed/scope.list"):
                      print(" ", n, ":", z.read(n).decode().strip().replace("\n", " | ") if n in names else "MISSING")
                  needle = b"com/johnny/wxscript/entry/LibXposedEntry"
                  print("  modern entry class in dex:", needle in dex)
              print("  assets/xposed_init present:", "assets/xposed_init" in names)
          PY

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: wxscript-apk
          path: out/*.apk
          if-no-files-found: error

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: wxscript-apk
          path: out

      - name: Read version
        id: ver
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode=$CODE versionName=$NAME"

      - name: Check tag
        id: tag
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ steps.ver.outputs.code }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            NOTES=$(git log --pretty=format:'- %s (%h)' "$PREV"..HEAD)
          else
            NOTES=$(git log --pretty=format:'- %s (%h)' -20)
          fi
          printf 'WxScript %s\n\n%s\n' "${{ steps.ver.outputs.name }}" "$NOTES" > notes.md
          gh release create "v${{ steps.ver.outputs.code }}" out/*.apk \
            --title "WxScript ${{ steps.ver.outputs.name }} (v${{ steps.ver.outputs.code }})" \
            --notes-file notes.md

