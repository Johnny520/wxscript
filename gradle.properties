org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -Xss512k -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# 脚本运行时里有 147KB 的 ScriptPluginRuntime.kt 等大文件，Kotlin daemon 堆要给足
kotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
android.r8.maxWorkers=1
org.gradle.configuration-cache=false
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=600000
